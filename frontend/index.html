<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BGA Chat Widget - Demo</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f5;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .info {
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    .info h1 {
      color: #4f46e5;
      margin-bottom: 8px;
    }
  </style>
</head>

<body>
  <div class="info">
    <h1>Business Guide Agent</h1>
    <p>点击右下角 💬 按钮开始对话</p>
    <p style="margin-top: 12px;"><a href="/admin.html"
        style="color: #4f46e5; text-decoration: none; font-size: 13px;">📊 管理后台（项目/文档管理）→</a></p>
  </div>
  <div id="app"></div>
  <script type="module">
    import { createApp, h } from "vue";
    import { ChatWidget } from "./src/index";

    const config = {
      apiUrl: import.meta.env.VITE_API_URL || "http://localhost:3000",
      projectId: new URLSearchParams(window.location.search).get("projectId") || import.meta.env.VITE_PROJECT_ID || "966ce4f1-b36a-4e9c-813c-343cca323caa",
      token: import.meta.env.VITE_TOKEN || undefined,
      theme: "light",
      position: "bottom-right",
      title: "业务指引助手",
      placeholder: "输入你的问题...",
    };

    createApp({
      render() {
        return h(ChatWidget, { config });
      },
    }).mount("#app");
  </script>
</body>

</html>
